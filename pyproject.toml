[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neagent"
version = "2.0.0"
description = "Vertical-domain agent runtime with code-enforced state machine, approval gate, and tool gateway (battery-materials scenario)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]

[project.scripts]
neagent = "neagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
